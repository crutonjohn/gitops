---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zwavejs
spec:
  interval: 12h
  chart:
    spec:
      chart: app-template
      version: 3.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: mosquitto
      namespace: home
  values:
    controllers:
      zwavejs:
        type: deployment

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          zwavejs:
            nameOverride: zwavejs
            image:
              repository: zwavejs/zwave-js-ui
              tag: 11.22.3@sha256:14d018bb689eecce4029229764d2191d9b8d8f211106fcabaef421e7b0f8cf9c
            env:
              TZ: America/New_York
              ZWAVEJS_DATA: /usr/src/app/store
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 47m
              limits:
                memory: 512M

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 994
        runAsGroup: 994
        fsGroup: 994
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    ingress:
      zwavejs:
        # controller: "zwavejs"
        enabled: true
        annotations:
          opn.internal-dns.kubernetes.io/target: &target internal-ingress.${SECRET_DOMAIN}
          opn.internal-dns.kubernetes.io/hostname: &hostname ${INGRESSROUTE_SUBDOMAIN}.${FAMILY_DOMAIN}
          pi.internal-dns.kubernetes.io/target: *target
          pi.internal-dns.kubernetes.io/hostname: *hostname
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: auth-system-oauth-auth@kubernetescrd,auth-system-oauth-errors@kubernetescrd
        labels: {}
        className: traefik-internal
        hosts:
          - host: *hostname
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: ${APP}
                  port: 8091
        tls:
          - secretName: heyjohn-wildcard-certificate
            hosts:
              - *hostname

    service:
      zwavejs:
        enabled: true
        controller: zwavejs
        primary: true
        ports:
          http:
            port: 8091
          websocket:
            port: 3000

    persistence:
      config:
        existingClaim: zwavejs-config
        globalMounts:
          - path: /usr/src/app/store
            readOnly: false
